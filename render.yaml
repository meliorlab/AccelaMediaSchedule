services:
  - type: web
    name: accela-media-api
    runtime: node
    # A persistent disk requires a paid instance type (Free has no persistent storage).
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.4.1
      - key: DATA_DIR
        value: /var/data
    disk:
      name: media-data
      mountPath: /var/data
      sizeGB: 1
